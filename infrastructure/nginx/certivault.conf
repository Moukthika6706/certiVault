# /etc/nginx/conf.d/certivault.conf
#
# Browser ──► Nginx :80 ──┬──► /            React build (static files in /var/www/certivault)
#                         └──► /api/...     Express backend on 127.0.0.1:4000 (never exposed publicly)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/certivault;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;   # backend accepts PDFs up to 5 MB

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → Node.js/Express (managed by PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fingerprinted Vite assets can be cached forever
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React Router: serve index.html for client-side routes like /verify/<id>
    location / {
        try_files $uri $uri/ /index.html;
    }
}
