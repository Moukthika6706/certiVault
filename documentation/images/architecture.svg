<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F8624"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A21CAF"/>
    </marker>
  </defs>

  <rect width="1000" height="610" fill="#FFFFFF"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#0F172A">CertiVault — AWS Architecture</text>
  <text x="24" y="56" font-size="12" fill="#64748B">Three layers: presentation (React) · application (Express on EC2) · storage (Amazon S3)</text>

  <!-- Users -->
  <rect x="24" y="118" width="160" height="66" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="104" y="146" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Administrator</text>
  <text x="104" y="166" font-size="11" fill="#64748B" text-anchor="middle">Browser · JWT sign-in</text>

  <rect x="24" y="330" width="160" height="66" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="104" y="358" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Public verifier</text>
  <text x="104" y="378" font-size="11" fill="#64748B" text-anchor="middle">Browser · scans QR code</text>

  <!-- AWS cloud -->
  <rect x="220" y="72" width="760" height="520" rx="14" fill="none" stroke="#232F3E" stroke-width="1.6"/>
  <rect x="220" y="72" width="270" height="26" rx="6" fill="#232F3E"/>
  <text x="234" y="90" font-size="12" font-weight="600" fill="#FFFFFF">AWS Cloud · Region ap-south-1 (Mumbai)</text>

  <!-- Security group -->
  <rect x="242" y="112" width="430" height="300" rx="10" fill="none" stroke="#DC2626" stroke-dasharray="6 4"/>
  <text x="256" y="131" font-size="11" fill="#B91C1C">Security group · inbound: SSH 22 (my IP only) · HTTP 80 · HTTPS 443</text>

  <!-- EC2 -->
  <rect x="258" y="142" width="398" height="256" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <text x="274" y="164" font-size="13" font-weight="700" fill="#9A3412">Amazon EC2</text>
  <text x="362" y="164" font-size="11" fill="#9A3412">t3.micro · Amazon Linux 2023</text>

  <rect x="276" y="178" width="164" height="56" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="358" y="202" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Nginx :80</text>
  <text x="358" y="221" font-size="11" fill="#64748B" text-anchor="middle">reverse proxy</text>

  <rect x="474" y="178" width="164" height="56" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="556" y="202" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">React build</text>
  <text x="556" y="221" font-size="11" fill="#64748B" text-anchor="middle">static files</text>

  <rect x="276" y="262" width="164" height="60" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="358" y="287" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Node.js + Express</text>
  <text x="358" y="307" font-size="11" fill="#64748B" text-anchor="middle">PM2 · 127.0.0.1:4000</text>

  <rect x="474" y="262" width="164" height="60" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="556" y="287" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">SQLite</text>
  <text x="556" y="307" font-size="11" fill="#64748B" text-anchor="middle">metadata · hashes · S3 keys</text>

  <rect x="276" y="340" width="362" height="40" rx="8" fill="#FFF1F2" stroke="#DD344C"/>
  <text x="457" y="358" font-size="12" font-weight="600" fill="#9F1239" text-anchor="middle">IAM role: CertiVault-EC2-Role (instance profile)</text>
  <text x="457" y="373" font-size="10.5" fill="#9F1239" text-anchor="middle">temporary credentials via IMDSv2 — no access keys on disk</text>

  <!-- inner arrows -->
  <line x1="440" y1="206" x2="472" y2="206" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="456" y="198" font-size="10" fill="#475569" text-anchor="middle">/</text>
  <line x1="358" y1="234" x2="358" y2="260" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="366" y="251" font-size="10" fill="#475569">/api</text>
  <line x1="440" y1="292" x2="472" y2="292" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Users → Nginx -->
  <path d="M184,151 H226 V206 H274" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M184,363 H226 V206" fill="none" stroke="#334155" stroke-width="1.4"/>
  <text x="190" y="143" font-size="10.5" fill="#475569">HTTP :80</text>
  <text x="190" y="355" font-size="10.5" fill="#475569">/verify/&lt;id&gt;</text>

  <!-- S3 -->
  <rect x="716" y="142" width="240" height="190" rx="10" fill="#F0FDF4" stroke="#3F8624" stroke-width="1.4"/>
  <text x="732" y="166" font-size="13" font-weight="700" fill="#166534">Amazon S3</text>
  <text x="732" y="185" font-size="11" fill="#166534" font-family="ui-monospace, Menlo, monospace">certivault-certificates-…</text>
  <text x="732" y="210" font-size="11.5" fill="#14532D">• Block Public Access: ON</text>
  <text x="732" y="229" font-size="11.5" fill="#14532D">• Default encryption: SSE-S3</text>
  <text x="732" y="248" font-size="11.5" fill="#14532D">• Versioning: Enabled</text>
  <text x="732" y="267" font-size="11.5" fill="#14532D">• HTTPS-only bucket policy</text>
  <text x="732" y="294" font-size="10.5" fill="#166534" font-family="ui-monospace, Menlo, monospace">certificates/2026/&lt;uuid&gt;.pdf</text>
  <text x="732" y="314" font-size="10.5" fill="#4D7C0F">object key prefix (not a real folder)</text>

  <!-- EC2 → S3 -->
  <path d="M656,300 H714" fill="none" stroke="#3F8624" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="662" y="284" font-size="10" fill="#3F8624">SDK v3</text>
  <text x="662" y="296" font-size="10" fill="#3F8624">Put/Get</text>

  <!-- CloudWatch -->
  <rect x="716" y="420" width="240" height="120" rx="10" fill="#FDF4FF" stroke="#A21CAF" stroke-width="1.4"/>
  <text x="732" y="444" font-size="13" font-weight="700" fill="#86198F">Amazon CloudWatch</text>
  <text x="732" y="467" font-size="11.5" fill="#701A75">• Metric: AWS/EC2 CPUUtilization</text>
  <text x="732" y="486" font-size="11.5" fill="#701A75">• Alarm: CPU ≥ 70% for 2 × 5 min</text>
  <text x="732" y="505" font-size="11.5" fill="#701A75">• Status checks, network in/out</text>
  <text x="732" y="524" font-size="11.5" fill="#701A75">• Optional: SNS e-mail notification</text>

  <!-- EC2 → CloudWatch -->
  <path d="M457,398 V480 H714" fill="none" stroke="#A21CAF" stroke-width="1.4" marker-end="url(#arrowPurple)"/>
  <text x="470" y="472" font-size="10.5" fill="#A21CAF">metrics published automatically (5-min basic monitoring)</text>

  <!-- presigned download -->
  <path d="M104,396 V566 H968 V237 H958" fill="none" stroke="#3F8624" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <text x="250" y="558" font-size="11" fill="#3F8624">PDF download: browser fetches a presigned S3 URL directly (expires after 5 minutes)</text>
</svg>
